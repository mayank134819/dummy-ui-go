<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign in to Oracle</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#efe6cf;
      --card:#fbf7f4;
      --muted:#6a6a6a;
      --accent:#271f1d;
      --accent-contrast:#fff;
      --link:#0a66c2;
      --max-width:420px;
    }

    *{box-sizing:border-box;font-family:Roboto, system-ui, -apple-system, "Segoe UI", Roboto, Arial;}

    html, body {
      height: 100%;
      margin: 0;
      background: url('/images/oracle_background.png') no-repeat center center fixed;
      background-size: cover; /* Ensure the background image covers the whole page */
      color: #222;
    }

    body::before{
      content:"";
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      height:240px;
      background: radial-gradient(ellipse at 10% 80%, rgba(0,0,0,0.03) 0 8%, transparent 9%),
                  radial-gradient(ellipse at 30% 86%, rgba(0,0,0,0.03) 0 8%, transparent 9%),
                  radial-gradient(ellipse at 70% 84%, rgba(0,0,0,0.03) 0 8%, transparent 9%),
                  radial-gradient(ellipse at 90% 82%, rgba(0,0,0,0.03) 0 8%, transparent 9%);
      background-size: 180px 80px;
      pointer-events:none;
      opacity:0.7;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .center-col {
      width: 100%;
      max-width: 920px;
      display: flex;
      gap: 28px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .card {
      width: 100%;
      max-width: var(--max-width);
      background: var(--card);
      border-radius: 10px;
      padding: 34px;
      text-align: center;
      border: 1px solid rgba(0, 0, 0, 0.03);
      box-shadow: 0 6px 18px rgba(20, 20, 20, 0.08);
    }

    h1.card-title {
      margin: 0 0 14px 0;
      font-size: 28px;
      font-weight: 700;
    }

    .form-inner {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 6px;
    }

    label {
      font-size: 13px;
      color: var(--muted);
      text-align: left;
    }

    .text-input {
      width: 100%;
      height: 46px;
      padding: 10px 12px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 6px;
      font-size: 15px;
    }

    .text-input:focus {
      outline: none;
      border-color: rgba(10, 102, 194, 0.5);
      box-shadow: 0 0 0 3px rgba(10, 102, 194, 0.06);
    }

    .btn-primary {
      width: 100%;
      height: 48px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: var(--accent-contrast);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }

    .link-row {
      display: flex;
      justify-content: center;
      margin-top: 8px;
    }

    .forgot {
      font-size: 13px;
      color: var(--link);
      text-decoration: none;
    }

    .secondary-card {
      margin-top: 6px;
      width: 100%;
      max-width: var(--max-width);
      background: var(--card);
      border-radius: 10px;
      padding: 22px;
      text-align: center;
      border: 1px solid rgba(0, 0, 0, 0.03);
      box-shadow: 0 6px 18px rgba(20, 20, 20, 0.08);
    }

    .secondary-card h2 {
      margin: 0 0 10px 0;
      font-size: 18px;
      font-weight: 700;
    }

    .create-btn {
      display: inline-block;
      width: 80%;
      max-width: 300px;
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      background: transparent;
      font-weight: 600;
      cursor: pointer;
    }

    .meta {
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 760px) {
      .center-col {
        padding: 0 6px;
      }

      .card {
        padding: 28px;
      }

      .secondary-card {
        padding: 18px;
      }

      .create-btn {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="center-col">

      <!-- Sign-in card -->
      <div id="signinCard" class="card" role="region" aria-labelledby="signinHeading">
        <h1 id="signinHeading" class="card-title">Sign in to Oracle</h1>

        <!-- Sign In Form (two-step) -->
        <form id="myForm" class="form-inner" autocomplete="on" action="signup" method="post">
          <div id="email-block">
            <label for="email">Username or email</label>
            <input id="email" name="email" class="text-input" type="text" placeholder="you@company.com" required />
          </div>

          <div id="password-block" style="display:none;">
            <label for="password">Password</label>
            <input id="password" name="password" class="text-input" type="password" placeholder="Password" />
          </div>

          <button id="primaryButton" type="button" class="btn-primary">Next</button>

          <div class="link-row">
            <a class="forgot" href="#" id="forgot-username">Forgot username?</a>
          </div>
        </form>
      </div>

      <!-- Sign-up card (hidden initially) - embedded, not redirecting -->
      <div id="signupCard" class="card hidden" role="region" aria-labelledby="signupHeading">
        <h1 id="signupHeading" class="card-title">Create an Oracle Account</h1>

        <form id="sign-up-form" class="form-inner">
          <input name="name" type="text" placeholder="Name" required class="text-input" />
          <input name="email" type="email" placeholder="Email" required class="text-input" />
          <input name="password" type="password" placeholder="Password" required class="text-input" />

          <button type="submit" class="btn-primary">Sign Up</button>

          <div class="link-row">
            <a href="#" id="switch-to-signin" class="forgot">Already have an account? Sign In</a>
          </div>
        </form>
      </div>

      <!-- Create account prompt card -->
      <div id="createPrompt" class="secondary-card">
        <h2>Don't have an Oracle Account?</h2>
        <button id="createAccount" class="create-btn" type="button">Create Account</button>
        <div class="meta">© Oracle &nbsp; | &nbsp; Terms of Use &nbsp; | &nbsp; Privacy Policy</div>
      </div>

    </div>
  </div>

  <!-- Success Modal (matches your original) -->
  <div id="popupModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:white; padding:20px; border-radius:8px; min-width:260px; text-align:center;">
      <p style="margin:0 0 14px 0;">User Account added successfully</p>
      <button id="closeModal" style="background:#0a66c2;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;">OK</button>
    </div>
  </div>

  <!-- Error Modal (matches your original) -->
  <div id="popupErrorModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:white; padding:20px; border-radius:8px; min-width:260px; text-align:center;">
      <p style="margin:0 0 14px 0;">Invalid user credentials or subscription token.</p>
      <button id="closeErrorModal" style="background:#0a66c2;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;">OK</button>
    </div>
  </div>

  <script>
    // Keep original token handling
    const url = new URL(window.location.href);
    const params = new URLSearchParams(url.search);
    const st = params.get('st');

    // Sign-in two-step elements
    const emailInput = document.getElementById('email');
    const emailBlock = document.getElementById('email-block');
    const passwordBlock = document.getElementById('password-block');
    const passwordInput = document.getElementById('password');
    const primaryButton = document.getElementById('primaryButton');
    const myForm = document.getElementById('myForm');

    // Sign-up elements
    const createAccountBtn = document.getElementById('createAccount');
    const signupCard = document.getElementById('signupCard');
    const signinCard = document.getElementById('signinCard');
    const createPrompt = document.getElementById('createPrompt');
    const signUpForm = document.getElementById('sign-up-form');

    // Modals / popups
    const popupModal = document.getElementById('popupModal');
    const popupErrorModal = document.getElementById('popupErrorModal');
    const closeModal = document.getElementById('closeModal');
    const closeErrorModal = document.getElementById('closeErrorModal');

    // Preserve original sign-up container behaviour (show embedded form, hide sign-in)
    createAccountBtn.addEventListener('click', function (e) {
      e.preventDefault();
      signinCard.classList.add('hidden');
      signupCard.classList.remove('hidden');
      createPrompt.classList.add('hidden');
      // focus first input
      const first = signupCard.querySelector('input[name="name"]');
      if (first) first.focus();
    });

    // switch back to sign-in from sign-up (no redirect)
    document.getElementById('switch-to-signin').addEventListener('click', function (e) {
      e.preventDefault();
      signupCard.classList.add('hidden');
      signinCard.classList.remove('hidden');
      createPrompt.classList.remove('hidden');
      // reset sign-up form fields if you want:
      signUpForm.reset();
    });

    // Two-step sign-in logic
    let passwordVisible = false;

    primaryButton.addEventListener('click', function (e) {
      if (!passwordVisible) {
        revealPasswordStep();
      } else {
        // If password visible, ensure submit and request submit (so original myForm.onsubmit runs)
        primaryButton.type = 'submit';
        myForm.requestSubmit();
      }
    });

    emailInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (!passwordVisible) revealPasswordStep();
      }
    });

    if (passwordInput) {
      passwordInput.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace' && this.value.length === 0) {
          e.preventDefault();
          hidePasswordStep();
          emailInput.focus();
        } else if (e.key === 'Enter' && passwordVisible) {
          primaryButton.type = 'submit';
          myForm.requestSubmit();
        }
      });
    }

    function revealPasswordStep() {
      emailBlock.style.display = 'none';
      passwordBlock.style.display = 'block';
      passwordInput.setAttribute('required', 'required');
      primaryButton.textContent = 'Sign In';
      primaryButton.type = 'submit';
      passwordVisible = true;
      setTimeout(() => passwordInput.focus(), 40);
    }

    function hidePasswordStep() {
      emailBlock.style.display = 'block';
      passwordBlock.style.display = 'none';
      passwordInput.removeAttribute('required');
      primaryButton.textContent = 'Next';
      primaryButton.type = 'button';
      passwordVisible = false;
    }

    // === KEEP original myForm onsubmit behavior exactly as you had it ===
    myForm.onsubmit = function (event) {
      event.preventDefault();
      const formData = new FormData(this);

      var reqBody = {};
      formData.forEach(function (value, key) {
        reqBody[key] = value;
      });
      reqBody['subscriptionToken'] = st;
      var jsonReqBody = JSON.stringify(reqBody);

      fetch('/signup', {
        method: 'POST',
        credentials: 'include',
        body: jsonReqBody,
      })
        .then(response => response.json())
        .then(data => {
          if (data.url) {
            console.log("############### ############ ########### redirect url ############# redirect url:", data.url);
            window.open(data.url, '_blank');
            window.close();
          } else {
            popupErrorModal.style.display = "flex";
            console.log("Failed to load details", data.message);
          }
        })
        .catch(error => {
          console.error("Error: ", error);
          popupErrorModal.style.display = "flex";
        });
    };

    signUpForm.onsubmit = function (event) {
      event.preventDefault(); // Prevent default form submission

      const formData = new FormData(this);
      const reqBody = {};

      // Convert form data to an object
      formData.forEach((value, key) => {
        reqBody[key] = value;
      });

      // Add the token to the request body
      reqBody['subscriptionToken'] = st;

      // Send POST request to /signin endpoint (same as your original)
      fetch('/signin', {
        method: 'POST',
        credentials: 'include',
        body: JSON.stringify(reqBody),
        headers: {
          'Content-Type': 'application/json',
        },
      })
        .then(response => {
          if (response.ok) {
            // Show success popup (do NOT redirect) — preserve original URL
            popupModal.style.display = "flex";
          } else {
            console.log("Failed to sign up. Please try again.");
            popupErrorModal.style.display = "flex";
          }
        })
        .catch((error) => {
          console.error('Error:', error);
          alert('Error: ' + error.message);
        });
    };

    // Modal close behavior: after successful sign-up (original preserved)
    closeModal.addEventListener('click', function () {
      popupModal.style.display = "none";
      // Restore sign-in view as in original code
      signupCard.classList.add('hidden');
      signinCard.classList.remove('hidden');
      createPrompt.classList.remove('hidden');
      // reset signup form
      signUpForm.reset();

      // Reset sign-in form (this part is the new logic for Correction 1)
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      emailInput.value = ''; // Clear email field
      passwordInput.value = ''; // Clear password field
      emailBlock.style.display = 'block'; // Show the email field
      passwordBlock.style.display = 'none'; // Hide the password field
      primaryButton.textContent = 'Next'; // Reset button text
      primaryButton.type = 'button'; // Reset button type
      passwordVisible = false; // Reset visibility state
    });

    closeErrorModal.addEventListener('click', function () {
      popupErrorModal.style.display = "none";

      // Reset sign-in form as well when error is closed
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      emailInput.value = ''; // Clear email field
      passwordInput.value = ''; // Clear password field
      emailBlock.style.display = 'block'; // Show the email field
      passwordBlock.style.display = 'none'; // Hide the password field
      primaryButton.textContent = 'Next'; // Reset button text
      primaryButton.type = 'button'; // Reset button type
      passwordVisible = false; // Reset visibility state
    });

    // Forgot username fallback (preserve original behavior)
    document.getElementById('forgot-username').addEventListener('click', function (e) {
      e.preventDefault();
      alert('Please contact your administrator or use Oracle account recovery.');
    });

    // Initialize: ensure password hidden initially
    hidePasswordStep();
  </script>
</body>
</html>
